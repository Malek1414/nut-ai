# Snapmenu API. Local: `npm run dev` (wrangler dev --local, placeholder D1 id below). Deploy: see [env.production].
name = "snapmenu-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# AI_PROVIDER selects openai (default) or anthropic. OPENAI_MODEL serves all OpenAI jobs.
# The Claude settings stay available for switching back (src/models.ts).
# To switch one, change the value and
# deploy; no code change. Locally a line in .dev.vars wins over these.
#   MODEL_READ   reads the menu photo
#   MODEL_VOICE  writes the words people read (why a dish, how to order it your way)
# Compare two models on real scans first: `npm run bench:latency -w @snapmenu/api` (paid AI calls).
[vars]
AI_PROVIDER = "openai"
OPENAI_MODEL = "gpt-5.4-mini"
MODEL_READ = "claude-opus-5-5"
MODEL_VOICE = "claude-opus-5-5"

[[d1_databases]]
binding = "DB"
database_name = "snapmenu"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder; local D1 only until deploy

# Import the Nut AI engine packages straight from their TypeScript source.
[alias]
"@nutai/core-schema" = "../../packages/core-schema/src/index.ts"
"@nutai/gram-engine" = "../../packages/gram-engine/src/index.ts"
"@nutai/resolver" = "../../packages/resolver/src/index.ts"
"@nutai/totals" = "../../packages/totals/src/index.ts"
"@nutai/confidence" = "../../packages/confidence/src/index.ts"
"@nutai/repair" = "../../packages/repair/src/index.ts"
"@nutai/db-adapter" = "../../packages/db-adapter/src/index.ts"
"@nutai/clamp" = "../../packages/clamp/src/index.ts"

# Public deploy (Workers free plan): one Worker serves /api/* and the built web app.
#   npm run build -w @snapmenu/web && npx wrangler deploy --env production
[env.production]
name = "snapmenu"
workers_dev = true

# Variables are not inherited by an environment: production names its models here.
[env.production.vars]
AI_PROVIDER = "openai"
OPENAI_MODEL = "gpt-5.4-mini"
SCAN_STREAM = "off"
AUTH_ORIGIN = "https://snapmenu.malek-hassan.workers.dev"
MODEL_READ = "claude-opus-5-5"
MODEL_VOICE = "claude-opus-5-5"

[env.production.assets]
directory = "../snapmenu-web/dist"
not_found_handling = "single-page-application"
# /s/<id> is a share link: the Worker answers it with the rich preview (OpenGraph), then sends the browser on to the app.
run_worker_first = ["/api/*", "/s/*"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "snapmenu-prod"
database_id = "1cf60d71-37ad-4988-8572-5852589d8f3c"

[env.production.observability]
enabled = true
